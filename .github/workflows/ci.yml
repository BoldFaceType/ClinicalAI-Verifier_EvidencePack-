name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: python -m pip install --upgrade pip "ruff>=0.11,<0.12"

      - name: Run ruff
        run: ruff check src tests

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Smoke test preflight validator
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fields = [
              "member_id",
              "measure_id",
              "screening_date",
              "screening_tool",
              "screening_score",
              "screening_loinc",
              "bipolar_history",
              "prior_year_depression_dx",
              "source_kind",
              "follow_up_code",
              "follow_up_date",
              "measure_year",
          ]
          row = dict.fromkeys(fields, "")
          row.update(
              {
                  "member_id": "SMOKE001",
                  "measure_id": "DSF-E",
                  "screening_date": "2024-03-15",
                  "screening_tool": "PHQ-9",
                  "screening_score": "5",
                  "screening_loinc": "44261-6",
                  "bipolar_history": "false",
                  "prior_year_depression_dx": "false",
                  "source_kind": "structured",
              }
          )
          with Path("smoke_test.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerow(row)
          PY
          validate-dsfe smoke_test.csv out/preflight
          test -f out/preflight/findings.json
          test -f out/preflight/summary.md
          test -f out/preflight/findings.csv
          test -f out/preflight/per_member.json

      - name: Smoke test evidence packer
        run: |
          evidence-packer \
            examples/evidence_ai/claimresponse_denied.json \
            examples/evidence_ai/clinical_notes \
            out/evidence \
            --mode deterministic \
            --no-color
          test -f out/evidence/packet.json
          test -f out/evidence/appeal_packet.pdf

  package:
    name: Package Build
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
